# Netlify deploy — Puitmajaliit Virtuaalne mudeldaja (Game SPA).
# Backend (Firestore + Cloud Functions) elab Firebase'is projektis
# puitmajaliit-game. See toml ehitab Vite SPA + proxyb /api/** Firebase
# Functionsile, nii et SPA räägib same-origin'ina.

[build]
  base = ""
  command = "yarn install --frozen-lockfile && yarn build"
  publish = "dist"

[build.environment]
  # Node 22 — camera-controls@3.1.2 (drei transitive dep) nõuab >=22.
  NODE_VERSION = "22"
  # Vite env'id (VITE_*) kompileeritakse build'i sisse — vt .env.production.
  # Override võimalik Netlify UI-s: Site settings → Environment variables.

# API proxy — SPA päringud /api/** → Firebase Functions.
# status = 200 = rewrite (URL ei muutu brauseris, same-origin fetch).
[[redirects]]
  from = "/api/*"
  to = "https://europe-west1-puitmajaliit-game.cloudfunctions.net/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback (currently app has no routes, aga tulevikus).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Turvalisusepäised (lightweight — pole CSP, kuna R3F + Google Fonts).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# GLB-d (3D mudelid) — cache agresiivselt, nimi sisaldab hash'i Vite buildist.
[[headers]]
  for = "/GLB/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
